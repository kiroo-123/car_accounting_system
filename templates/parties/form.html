{% extends "base.html" %}
{% block title %}{{ 'إضافة ' ~ cfg.singular if mode == 'add' else 'تعديل ' ~ cfg.singular }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ cfg.add_title if mode == 'add' else 'تعديل بيانات ' ~ cfg.singular }}</h1>
</div>

<form method="POST" class="card form-card">
  <div class="form-row">
    <div class="form-group">
      <label>الاسم *</label>
      <input type="text" name="name" required value="{{ values.name or '' }}" placeholder="الاسم بالكامل">
    </div>
    <div class="form-group">
      <label>رقم الهاتف</label>
      <input type="tel" name="phone" value="{{ values.phone or '' }}" placeholder="01xxxxxxxxx">
    </div>
  </div>
  <div class="form-group">
    <label>ملاحظات</label>
    <textarea name="notes" rows="2" placeholder="أي ملاحظات إضافية">{{ values.notes or '' }}</textarea>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary btn-lg">حفظ</button>
    <a href="{{ url_for(cfg.endpoint ~ '.list_view') }}" class="btn btn-ghost">إلغاء</a>
  </div>
</form>
{% endblock %}
