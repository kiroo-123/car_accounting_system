{% extends "base.html" %}
{% block title %}{{ 'تسجيل صيانة' if mode == 'add' else 'تعديل صيانة' }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ 'تسجيل مصروف صيانة جديد' if mode == 'add' else 'تعديل مصروف الصيانة' }}</h1>
</div>

<form method="POST" class="card form-card">
  <div class="form-row">
    <div class="form-group">
      <label>التاريخ *</label>
      <input type="date" name="date" required value="{{ values.date or today }}">
    </div>
    <div class="form-group">
      <label>العربية *</label>
      <select name="vehicle_id" required>
        <option value="">اختار العربية</option>
        {% for v in vehicles %}
        <option value="{{ v.id }}" {{ 'selected' if values.vehicle_id|string == v.id|string }}>{{ v.code_name or v.plate_number }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>نوع المصروف *</label>
      <select name="expense_type" required>
        <option value="">اختار النوع</option>
        {% for t in types %}
        <option value="{{ t }}" {{ 'selected' if values.expense_type == t }}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>المبلغ (جنيه) *</label>
      <input type="number" min="0" step="0.01" name="amount" required value="{{ values.amount or '' }}" placeholder="0">
    </div>
  </div>
  <div class="form-group">
    <label>الوصف</label>
    <input type="text" name="description" value="{{ values.description or '' }}" placeholder="وصف تفصيلي للمصروف">
  </div>
  <div class="form-group">
    <label>ملاحظات</label>
    <textarea name="notes" rows="2">{{ values.notes or '' }}</textarea>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary btn-lg">حفظ</button>
    <a href="{{ url_for('finance.maintenance_list') }}" class="btn btn-ghost">إلغاء</a>
  </div>
</form>
{% endblock %}
